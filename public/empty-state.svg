<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Minimale Line-Illustration: offener Koffer, Polaroids, Papierflieger (coral/violet duotone) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Koffer (geöffnet) -->
    <rect x="170" y="210" width="260" height="120" rx="18" stroke="#A78BFA" stroke-width="6"/>
    <path d="M170 210 L200 130 Q202 122 212 124 L400 160 Q410 162 408 172 L398 210"
          stroke="#A78BFA" stroke-width="6"/>
    <line x1="170" y1="270" x2="430" y2="270" stroke="#A78BFA" stroke-width="4" opacity="0.5"/>
    <rect x="270" y="298" width="60" height="24" rx="8" stroke="#FF5C7A" stroke-width="5"/>
    <path d="M282 210 v-14 q0 -10 10 -10 h16 q10 0 10 10 v14" stroke="#FF5C7A" stroke-width="5"/>
    <!-- Polaroid 1 -->
    <g transform="rotate(-10 250 130)">
      <rect x="215" y="90" width="70" height="82" rx="6" fill="#14141F" stroke="#F5EFE6" stroke-width="5"/>
      <rect x="225" y="100" width="50" height="46" rx="3" stroke="#FF5C7A" stroke-width="4"/>
      <circle cx="240" cy="114" r="6" stroke="#FF5C7A" stroke-width="3"/>
      <path d="M227 142 l12 -12 10 10 8 -8 10 10" stroke="#FF5C7A" stroke-width="3"/>
    </g>
    <!-- Polaroid 2 -->
    <g transform="rotate(8 350 120)">
      <rect x="315" y="80" width="70" height="82" rx="6" fill="#14141F" stroke="#F5EFE6" stroke-width="5"/>
      <rect x="325" y="90" width="50" height="46" rx="3" stroke="#A78BFA" stroke-width="4"/>
      <path d="M328 128 l10 -14 10 12 8 -8 12 12" stroke="#A78BFA" stroke-width="3"/>
    </g>
    <!-- Papierflieger -->
    <g transform="rotate(14 470 110)">
      <path d="M440 110 L520 86 L476 138 L464 118 Z" stroke="#FF5C7A" stroke-width="5" fill="#14141F"/>
      <path d="M464 118 L476 138 L470 116" stroke="#FF5C7A" stroke-width="4"/>
      <path d="M430 132 q-14 10 -8 24" stroke="#FF5C7A" stroke-width="3" stroke-dasharray="2 8"/>
    </g>
    <!-- Funkeln -->
    <path d="M140 120 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z" stroke="#A78BFA" stroke-width="4"/>
    <circle cx="480" cy="230" r="5" stroke="#FF5C7A" stroke-width="4"/>
    <circle cx="120" cy="250" r="4" stroke="#5EEAD4" stroke-width="4"/>
  </g>
</svg>
