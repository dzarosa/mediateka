<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Hand-authored „Hanko"-Stempel: coral Siegel mit 2026 + KJ-Monogramm -->
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <radialGradient id="fill" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#FF5C7A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF5C7A" stop-opacity="0.08"/>
    </radialGradient>
  </defs>
  <g filter="url(#rough)">
    <circle cx="128" cy="128" r="112" fill="url(#fill)"/>
    <circle cx="128" cy="128" r="112" fill="none" stroke="#FF5C7A" stroke-width="12"/>
    <circle cx="128" cy="128" r="92" fill="none" stroke="#FF5C7A" stroke-width="3" opacity="0.8"/>
  </g>
  <text x="128" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="900" font-size="64" fill="#FF5C7A" letter-spacing="2">2026</text>
  <text x="128" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="700" font-size="28" fill="#FF5C7A" letter-spacing="8">KJ</text>
  <!-- Stempel-Unregelmäßigkeiten -->
  <circle cx="52" cy="70" r="4" fill="#FF5C7A" opacity="0.7"/>
  <circle cx="205" cy="180" r="3" fill="#FF5C7A" opacity="0.6"/>
  <circle cx="196" cy="66" r="2.5" fill="#FF5C7A" opacity="0.5"/>
</svg>
